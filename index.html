
<!DOCTYPE html>
<html lang="en">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:Arial,Helvetica,sans-serif;color:#fff;display:grid;place-items:center;isolation:isolate}
body:before{content:"";position:fixed;inset:0;z-index:10;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0px,transparent 2px,rgba(255,0,0,.11) 3px,transparent 4px);mix-blend-mode:screen}
body:after{content:"";position:fixed;inset:0;z-index:9;pointer-events:none;background:radial-gradient(ellipse,transparent 15%,rgba(0,0,0,.65) 75%,#000 100%)}
#red{position:fixed;inset:0;background:#000;z-index:-3}
#glow{position:fixed;inset:-20%;z-index:-2;background:radial-gradient(ellipse at center,#4d0008 0%,#170003 30%,#000 70%);animation:hell 3s infinite}
@keyframes hell{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.16);opacity:1}}
#flash{position:fixed;inset:0;background:#ff0018;opacity:0;z-index:8;pointer-events:none}
body.bang #flash{animation:bang .2s steps(2)}
@keyframes bang{0%{opacity:.65}100%{opacity:0}}
#noise{position:fixed;inset:-50%;width:200%;height:200%;z-index:7;pointer-events:none;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");animation:grain .15s steps(2) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(2%,-1%)}50%{transform:translate(-1%,2%)}75%{transform:translate(1%,1%)}100%{transform:translate(-2%,-1%)}}
#frame{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:22px;position:relative;z-index:4;animation:arrival 1.4s ease-out}
@keyframes arrival{0%{opacity:0;transform:scale(1.15);filter:blur(12px)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
.content{width:100%;max-width:650px;text-align:center;position:relative}
.top{font-size:10px;letter-spacing:7px;color:#ff1b32;font-weight:900;margin-bottom:clamp(25px,8vh,65px);animation:fade 2s infinite}
.skull{font-size:clamp(48px,13vw,88px);line-height:1;margin-bottom:28px;color:#ff001e;text-shadow:0 0 8px #f00,0 0 25px #f00,0 0 65px #900;animation:heartbeat 1.6s infinite}
@keyframes heartbeat{0%,100%{transform:scale(1);filter:brightness(.8)}8%{transform:scale(1.09);filter:brightness(1.7)}16%{transform:scale(1)}24%{transform:scale(1.06)}32%{transform:scale(1)}}
h1{font-size:clamp(38px,10vw,76px);font-weight:1000;line-height:.96;letter-spacing:-2px;color:#fff;text-shadow:0 0 3px #fff,0 0 13px #f00,0 0 35px #f00;position:relative;animation:flicker 6s infinite}
h1:after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;height:100%;color:#ff002a;opacity:0;animation:distort 4s infinite}
@keyframes distort{0%,87%,89%,93%,100%{opacity:0;clip-path:inset(0 0 100% 0);transform:translateX(0)}88%{opacity:.9;clip-path:inset(25% 0 45% 0);transform:translateX(-9px)}92%{opacity:.8;clip-path:inset(60% 0 12% 0);transform:translateX(8px)}}
@keyframes flicker{0%,19%,21%,23%,80%,82%,100%{opacity:1}20%,81%{opacity:.48}}
.rule{height:2px;width:80%;margin:30px auto;background:linear-gradient(90deg,transparent,#ff001e,transparent);box-shadow:0 0 16px #f00}
.msg{font-size:clamp(13px,3.7vw,18px);font-weight:700;line-height:1.9;letter-spacing:1px;color:#d4b5b8}
.msg strong{color:#ff001e;text-shadow:0 0 14px #f00}
.admin{display:block;margin-top:8px;font-size:clamp(11px,3vw,14px);letter-spacing:2px;color:#ff5265}
.bottom{margin-top:clamp(30px,7vh,55px);display:flex;align-items:center;justify-content:center;gap:10px;color:#ff142b;font-size:9px;letter-spacing:4px;font-weight:bold}
.dot{width:6px;height:6px;border-radius:50%;background:red;box-shadow:0 0 15px red;animation:fade .7s infinite}
@keyframes fade{50%{opacity:.2}}
#edges{position:fixed;inset:12px;border:1px solid #ff001e32;z-index:6;pointer-events:none}
#edges:before,#edges:after{content:"";position:absolute;width:34px;height:34px;border-color:#ff001e;border-style:solid}
#edges:before{top:-1px;left:-1px;border-width:2px 0 0 2px}
#edges:after{right:-1px;bottom:-1px;border-width:0 2px 2px 0}
#counter{position:fixed;left:22px;bottom:23px;color:#681018;font-size:8px;letter-spacing:2px;z-index:6}
#warning{position:fixed;right:22px;bottom:23px;color:#681018;font-size:8px;letter-spacing:2px;z-index:6}
body.shake #frame{animation:shake .18s linear}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-5px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-3px,-1px)}}
@media(max-height:540px){.top{margin-bottom:15px}.skull{font-size:44px;margin-bottom:12px}.rule{margin:16px auto}.bottom{margin-top:18px}}
@media(prefers-reduced-motion:reduce){#noise,#glow,h1,.skull,.top,.dot{animation:none}}
</style>
</head>
<body>

<div id="glow"></div>
<div id="flash"></div>

<div id="counter">SECURITY LEVEL : BLACK</div>
<div id="warning">UNAUTHORIZED</div>

<script>
(function(){
let ctx=null;
let timer=null;
let started=false;
let lastBang=0;

function audioStart(){
if(started)return;
try{
ctx=new(window.AudioContext||window.webkitAudioContext)();
const master=ctx.createGain();
master.gain.value=.22;
master.connect(ctx.destination);

function tone(freq,duration,volume,type,delay){
const o=ctx.createOscillator();
const g=ctx.createGain();
const t=ctx.currentTime+(delay||0);
o.type=type||"square";
o.frequency.setValueAtTime(freq,t);
g.gain.setValueAtTime(.0001,t);
g.gain.exponentialRampToValueAtTime(volume,t+.015);
g.gain.setValueAtTime(volume,t+duration*.55);
g.gain.exponentialRampToValueAtTime(.0001,t+duration);
o.connect(g);
g.connect(master);
o.start(t);
o.stop(t+duration+.02);
}

function alarm(){
if(!ctx||ctx.state!=="running")return;
tone(960,.15,.20,"square",0);
tone(520,.22,.17,"sawtooth",.16);
tone(78,.65,.22,"sawtooth",.4);
}

function drone(){
if(!ctx||ctx.state!=="running")return;
tone(48,2,.10,"sawtooth",0);
tone(51,1.7,.055,"sine",0);
}

async function activate(){
if(ctx.state==="suspended")await ctx.resume();
if(ctx.state!=="running")return;
if(!started){
started=true;
alarm();
drone();
timer=setInterval(function(){
alarm();
if(Math.random()>.45)drone();
},2300);
}
}

activate().catch(function(){});
}catch(e){}
}

function effects(){
const now=Date.now();
if(now-lastBang<700)return;
lastBang=now;
document.body.classList.remove("bang","shake");
void document.body.offsetWidth;
document.body.classList.add("bang");
if(Math.random()>.4)document.body.classList.add("shake");
setTimeout(function(){
document.body.classList.remove("bang","shake");
},240);
}

audioStart();
setInterval(function(){
if(Math.random()>.45)effects();
},2400);

document.addEventListener("pointerdown",function(){
if(ctx&&ctx.state==="suspended")ctx.resume().catch(function(){});
audioStart();
},{passive:true});

document.addEventListener("visibilitychange",function(){
if(!document.hidden&&ctx&&ctx.state==="suspended"){
ctx.resume().catch(function(){});
}
});
})();
</script>
